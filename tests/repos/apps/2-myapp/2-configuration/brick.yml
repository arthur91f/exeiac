version: 1.0.0
module: exeiac-test2
dependencies:
  bastion_ip:
    from: infra/bastion/instance:output:$.ip
    #trigger_type: weak
  bastion_credentials:
    from: infra/bastion/configuration:output:$.users.myuser
    #trigger_type: weak
  instance_ip:
    from: apps/myapp/instance:output:$.ip
  instance_ram:
    from: apps/myapp/instance:output:$.ram
  database_ip:
    from: apps/database:output:$.instances.master.address
  database_credentials:
    from: apps/database:output:$.users.myapp
inputs:
- type: file
  format: json
  path: input.json
  datas:
    - bastion_ip
    - bastion_credentials
    - database_credentials
    - instance_ip
    - instance_ram


