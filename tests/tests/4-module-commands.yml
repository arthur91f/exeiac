- title: SCENARIO 2 (drift display) - setup change infra/base state (check show --format path)
  cmd: |
    state_path="$(exeiac show infra/base -f p)/state.exeiactest.json" ||
      echo "get infra/base state path failed"
    sed -i 's|^\( *\t* *"project_id":\) "[^"]*"|\1 "project:prod@mycompany:83416461"|g' "$state_path" 2>&1 ||
      echo "setup changed $state_path failed"
    
    state_path="$(exeiac show infra/network -f p)/state.exeiactest.json" ||
      echo "get infra/network state path failed"
    sed -i 's|^\( *\t* *"network_id":\) "[^"]*"|\1 "network:83416461-563710"|g' "$state_path" 2>&1 ||
      echo "setup changed $state_path failed"
    
    behaviour_path="$(exeiac show infra/bastion/instance -f p)/special_behaviours.exeiactest.json" ||
      echo "get infra/bastion/instance state path failed"
    echo '{ "plan": { "return_code": 3, "run": [ "default", "return_code" ] } }' > "$behaviour_path"
  status: 0
  stdout: ""
