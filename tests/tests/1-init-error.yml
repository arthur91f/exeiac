- title: no arg
  cmd: exeiac 2>&1
  status: 11
  stdout: |
    argument missing: you need at least to specify one action
- title: no arg (only option)
  cmd: exeiac --format name 2>&1
  status: 11
  stdout: |
    argument missing: you need at least to specify one action
- title: no action specified
  cmd: exeiac infra/base 2>&1
  status: 11
  stdout: |
    ! Bad argument: Error: you should specify at least a brick for infra/base action
